name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate tag matches package versions
        run: npx tsx scripts/prepare-publish.ts --tag ${{ github.ref_name }}

  ci:
    name: CI Checks
    needs: [validate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        if: matrix.node-version == 20
        run: npm run lint

      - name: Format check
        if: matrix.node-version == 20
        run: npm run format:check

      - name: Type check
        if: matrix.node-version == 20
        run: npm run typecheck

      - name: Run tests
        run: npm test

  build:
    name: Build
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Verify dist output
        run: |
          test -d packages/core/dist || (echo "ERROR: packages/core/dist not found" && exit 1)
          test -d packages/cli/dist || (echo "ERROR: packages/cli/dist not found" && exit 1)
          test -d packages/tools-file/dist || (echo "ERROR: packages/tools-file/dist not found" && exit 1)
          test -d packages/tools-web/dist || (echo "ERROR: packages/tools-web/dist not found" && exit 1)
          test -d packages/tools-shell/dist || (echo "ERROR: packages/tools-shell/dist not found" && exit 1)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            packages/core/dist/
            packages/cli/dist/
            packages/tools-file/dist/
            packages/tools-web/dist/
            packages/tools-shell/dist/
          retention-days: 1

  publish:
    name: Publish
    needs: [build]
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: packages/

      - name: Verify package contents
        run: |
          npm pack --dry-run --workspace=packages/core
          npm pack --dry-run --workspace=packages/cli
          npm pack --dry-run --workspace=packages/tools-file
          npm pack --dry-run --workspace=packages/tools-web
          npm pack --dry-run --workspace=packages/tools-shell

      - name: Publish @crewspace/core
        run: npm publish --workspace=packages/core --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @crewspace/cli
        run: npm publish --workspace=packages/cli --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @crewspace/tools-file
        run: npm publish --workspace=packages/tools-file --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @crewspace/tools-web
        run: npm publish --workspace=packages/tools-web --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @crewspace/tools-shell
        run: npm publish --workspace=packages/tools-shell --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published packages
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "Published @crewspace/core@${PACKAGE_VERSION}"
          sleep 10
          npm view @crewspace/core@${PACKAGE_VERSION} version || echo "WARN: Package may take a moment to appear on registry"
          npm view @crewspace/cli@${PACKAGE_VERSION} version || echo "WARN: Package may take a moment to appear on registry"
          npm view @crewspace/tools-file@${PACKAGE_VERSION} version || echo "WARN: Package may take a moment to appear on registry"
          npm view @crewspace/tools-web@${PACKAGE_VERSION} version || echo "WARN: Package may take a moment to appear on registry"
          npm view @crewspace/tools-shell@${PACKAGE_VERSION} version || echo "WARN: Package may take a moment to appear on registry"

  github-release:
    name: Create GitHub Release
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Create GitHub release with release notes
        run: npx tsx scripts/github-release.ts --tag ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
