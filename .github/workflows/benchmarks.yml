name: Performance Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run performance benchmarks
        run: npm run bench --workspace=packages/core

      - name: Run benchmarks (JSON output for CI)
        run: npm run bench:ci --workspace=packages/core
        continue-on-error: false

      - name: Check for performance regressions
        run: npm run bench:compare --workspace=packages/core

      - name: Generate performance report
        if: always()
        run: npm run bench:report --workspace=packages/core -- --output performance-report.md

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            packages/core/benchmark-results.json
            packages/core/benchmark-results-detailed.jsonl
            packages/core/performance-report.md
          retention-days: 90
