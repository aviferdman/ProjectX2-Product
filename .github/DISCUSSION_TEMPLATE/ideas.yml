title: '[Idea] '
labels: ['idea']
body:
  - type: markdown
    attributes:
      value: |
        ## 💡 Share an Idea

        Have an idea for improving Crewspace? We'd love to hear it!

  - type: textarea
    id: idea
    attributes:
      label: Idea Description
      description: Describe the idea or improvement you have in mind.
      placeholder: What would you like to see in Crewspace?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why would this be useful? What problem does it solve?
      placeholder: Describe the use case or pain point this addresses.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example Usage
      description: If applicable, show how this feature would be used.
      render: typescript
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative approaches or workarounds?
    validations:
      required: false
